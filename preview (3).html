<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Bravio — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0866ff;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 650px;
    }

    .logo {
      width: 95px;
      height: 95px;
      background: white;
      color: #0866ff;
      border-radius: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 58px;
      font-weight: 900;
      margin: 0 auto 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transform: rotate(-3deg);
    }

    h1 {
      font-size: clamp(40px, 8vw, 70px);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 19px;
      opacity: 0.9;
      margin-bottom: 45px;
    }

    .status {
      font-size: 24px;
      font-weight: bold;
      min-height: 60px;
      margin-bottom: 20px;
    }

    .progress-container {
      width: 100%;
      height: 18px;
      background: rgba(255,255,255,0.25);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress {
      width: 7%;
      height: 100%;
      background: white;
      border-radius: 20px;
      transition: width 0.6s ease;
    }

    #percentage {
      margin-bottom: 30px;
      opacity: 0.8;
    }

    button {
      border: none;
      background: white;
      color: #0866ff;
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.07);
    }

    button:active {
      transform: scale(0.95);
    }

    .footer {
      margin-top: 50px;
      font-size: 14px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">B</div>

    <h1>CONTENT BRAVIO</h1>

    <div class="tagline">
      Short-Form Content & Growth Agency
    </div>

    <div class="status" id="status">
      We're cooking something...
    </div>

    <div class="progress-container">
      <div class="progress" id="progress"></div>
    </div>

    <div id="percentage">7% ready</div>

    <button onclick="checkWebsite()">
      Is it ready yet?
    </button>

    <div class="footer">
      © 2026 Content Bravio
    </div>

  </div>

  <script>

    let progress = 7;

    const messages = [
      "Still cooking. Don't open the oven.",
      "The intern pressed something...",
      "Adding unnecessary animations...",
      "Pretending we understand the algorithm...",
      "Making the logo 2px bigger...",
      "Rewatching the same edit 47 times...",
      "Export failed. Classic.",
      "CEO said 'make it pop'...",
      "Optimising the vibes...",
      "Almost there. Probably.",
      "Uploading more pixels...",
      "Teaching the algorithm who's boss...",
      "Okay, this is actually looking good."
    ];

    function checkWebsite() {

      const status = document.getElementById("status");
      const bar = document.getElementById("progress");
      const percentage = document.getElementById("percentage");

      const randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

      progress += Math.floor(Math.random() * 12) + 2;

      if (progress >= 99) {
        progress = 99;
        status.innerText = "99% ready. The last 1% takes 6 months.";
      } else {
        status.innerText = randomMessage;
      }

      bar.style.width = progress + "%";
      percentage.innerText = progress + "% ready";
    }

  </script>

</body>
</html>
